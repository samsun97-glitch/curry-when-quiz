<head>

<title>영어 어순 퀴즈</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f9f2e7;color:#292031;font:1rem/1.55 system-ui,sans-serif}main{width:min(58rem,100% - 2rem);margin:auto;padding:clamp(1.4rem,5vw,4rem) 0}h1{font-size:clamp(2rem,6vw,3.4rem);line-height:1.1;letter-spacing:-.055em;margin:0 0 1.3rem}.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}.game{display:flex;flex-direction:column;align-items:flex-start;gap:.55rem;border-radius:1.25rem;padding:clamp(1rem,4vw,2rem);color:inherit;text-decoration:none;border:1px solid #8f6e53;min-height:14rem}.curry{background:#ffdc92;color:#382411}.ball{background:#2d2549;color:#fff1da;border-color:#6c5885}.icon{font-size:3.15rem;line-height:1.2}.title{font-size:clamp(1.4rem,4vw,2rem);font-weight:850}.action{margin-top:auto;padding:.5rem .8rem;border:1px solid currentColor;border-radius:.7rem;font-weight:800}.game:hover .action{text-decoration:underline}.game:focus-visible{outline:3px solid #267354;outline-offset:4px}@media(max-width:550px){.games{grid-template-columns:1fr}.game{min-height:0;gap:.4rem}.icon{font-size:2.4rem}.action{margin-top:.45rem}}

<body><main>

    </a>
  </nav>
</main></body>
</html>
